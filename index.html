<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b6bf5">
<title>Le Mie Spese</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1>Le Mie Spese</h1>
</header>

<main class="app-main">

  <!-- VISTA: AGGIUNGI + ELENCO -->
  <section id="view-spese" class="view">

    <form id="expense-form" class="card expense-form">
      <div class="field">
        <label for="amount">Importo (€)</label>
        <input type="number" id="amount" inputmode="decimal" step="0.01" min="0.01" placeholder="0,00" required>
      </div>

      <div class="field">
        <label for="category">Categoria</label>
        <select id="category" required>
          <option value="cibo">🍔 Cibo</option>
          <option value="trasporti">🚌 Trasporti</option>
          <option value="casa">🏠 Casa</option>
          <option value="svago">🎉 Svago</option>
          <option value="altro">📦 Altro</option>
        </select>
      </div>

      <div class="field">
        <label for="date">Data</label>
        <input type="date" id="date" required>
      </div>

      <div class="field">
        <label for="note">Nota (facoltativa)</label>
        <input type="text" id="note" placeholder="Es. spesa al supermercato" maxlength="80">
      </div>

      <button type="submit" class="btn-primary">Aggiungi spesa</button>
    </form>

    <div class="list-header">
      <h2>Elenco spese</h2>
      <span id="list-count" class="muted"></span>
    </div>

    <ul id="expense-list" class="expense-list"></ul>
    <p id="empty-state" class="empty-state">Nessuna spesa registrata. Aggiungine una qui sopra 👆</p>

  </section>

  <!-- VISTA: RIEPILOGO -->
  <section id="view-riepilogo" class="view hidden">

    <div class="card">
      <h2>Totale per categoria</h2>
      <div class="field month-filter">
        <label for="category-month-filter">Mese</label>
        <select id="category-month-filter"></select>
      </div>
      <ul id="category-totals" class="totals-list"></ul>
      <p id="category-empty" class="empty-state">Nessun dato per il periodo selezionato.</p>
    </div>

    <div class="card">
      <h2>Totale per mese</h2>
      <ul id="month-totals" class="totals-list"></ul>
      <p id="month-empty" class="empty-state">Nessun dato disponibile.</p>
    </div>

  </section>

</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="view-spese">
    <span class="nav-icon">🧾</span>
    <span>Spese</span>
  </button>
  <button class="nav-btn" data-view="view-riepilogo">
    <span class="nav-icon">📊</span>
    <span>Riepilogo</span>
  </button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
